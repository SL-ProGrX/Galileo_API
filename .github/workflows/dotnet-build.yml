permissions:
  contents: read
  pull-requests: write

name: .NET Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Test (.NET 10)
    runs-on: ubuntu-latest

    steps:
      # 1) Código
      - uses: actions/checkout@v4

      # 2) .NET 10
      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 3) Restore
      - name: Restore
        run: dotnet restore

      # 4) Build (Release)
      - name: Build
        run: dotnet build --no-restore -c Release

      # 5) Tests (si existen)
      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal
